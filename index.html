<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Game Translator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body style="margin: 0; background-color: #f2f2f7;">
<div class="app-container">
<header><div class="logo">🤖</div><h1>AI Game Translator</h1></header>
<main>
<div class="upload-card">
<p class="instruction">แคปหน้าจอเกม แล้วอัปโหลดรูปภาพที่นี่</p>
<label for="imageInput" class="upload-button">📸 เลือกรูปภาพ</label>
<input type="file" id="imageInput" accept="image/*" onchange="processImage()">
</div>
<div id="loading" class="hidden"><div class="spinner"></div><p>AI กำลังประมวลผลและแปลภาษา...</p></div>
<div id="resultArea" class="result-container hidden">
<div class="result-group"><p class="label">ข้อความต้นฉบับ:</p><div id="originalText" class="text-box"></div></div>
<div class="result-group"><p class="label">คำแปลภาษาไทย:</p><div id="translatedText" class="text-box highlight"></div></div>
<button class="reset-btn" onclick="location.reload()">แปลรูปใหม่</button>
</div>
</main>
</div>
<script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
